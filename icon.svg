<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3c2f24"/>
      <stop offset="100%" stop-color="#18130e"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe484"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="230" stroke="url(#gold)" stroke-width="12" fill="none"/>
  
  <!-- D20 Outline -->
  <polygon points="256,70 410,160 410,350 256,440 102,350 102,160" fill="#2a2018" stroke="url(#gold)" stroke-width="8"/>
  <polygon points="256,70 170,210 342,210" fill="#3a2e22" stroke="url(#gold)" stroke-width="6"/>
  <polygon points="170,210 342,210 256,380" fill="#4d3c2c" stroke="url(#gold)" stroke-width="6"/>
  
  <!-- Lines to outer points -->
  <line x1="256" y1="70" x2="102" y2="160" stroke="url(#gold)" stroke-width="6"/>
  <line x1="256" y1="70" x2="410" y2="160" stroke="url(#gold)" stroke-width="6"/>
  <line x1="170" y1="210" x2="102" y2="160" stroke="url(#gold)" stroke-width="6"/>
  <line x1="342" y1="210" x2="410" y2="160" stroke="url(#gold)" stroke-width="6"/>
  <line x1="170" y1="210" x2="102" y2="350" stroke="url(#gold)" stroke-width="6"/>
  <line x1="342" y1="210" x2="410" y2="350" stroke="url(#gold)" stroke-width="6"/>
  <line x1="256" y1="380" x2="102" y2="350" stroke="url(#gold)" stroke-width="6"/>
  <line x1="256" y1="380" x2="410" y2="350" stroke="url(#gold)" stroke-width="6"/>
  <line x1="256" y1="380" x2="256" y2="440" stroke="url(#gold)" stroke-width="6"/>
  <line x1="102" y1="350" x2="256" y2="440" stroke="url(#gold)" stroke-width="6"/>
  <line x1="410" y1="350" x2="256" y2="440" stroke="url(#gold)" stroke-width="6"/>

  <!-- Centered Number 20 -->
  <text x="256" y="315" font-family="Georgia, serif" font-size="88" font-weight="bold" fill="url(#gold)" text-anchor="middle" letter-spacing="2">20</text>
</svg>
